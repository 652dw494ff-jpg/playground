<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Fyzika – Online procvičování</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#18202a}
.card{max-width:800px;margin:auto;background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0001}
h1{margin-top:0} .q{font-size:20px;font-weight:bold;margin:25px 0 15px}
button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:2px solid #ddd;border-radius:12px;background:white;font-size:16px;cursor:pointer}
button:hover{background:#f0f4ff}.correct{border-color:#25a55b;background:#eaf9ef}.wrong{border-color:#d33;background:#fff0f0}
#next{display:none;text-align:center;background:#18202a;color:white;font-weight:bold}
#result{font-size:20px;font-weight:bold;margin-top:20px}.formula{background:#f1f3f5;padding:12px;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>⚡ Fyzika – online procvičování</h1>
<p>Elektrický náboj • atomy a ionty • elektrování • elektroskop • proud • Ohmův zákon</p>
<div id="app"></div>
<button id="next">Další otázka →</button>
<div id="result"></div>
</div>
<script>
const qs=[
["Která částice má kladný náboj?",["Elektron","Neutron","Proton","Atom"],2],
["Co vznikne, když atom získá elektrony?",["Kladný iont","Záporný iont","Neutrální atom","Proton"],1],
["Co se při elektrování běžně přesouvá?",["Protony","Neutrony","Elektrony","Jádra"],2],
["K čemu slouží elektroskop?",["Měření proudu","Zjištění elektrického náboje","Měření odporu","Měření teploty"],1],
["Co je elektrický proud?",["Pohyb neutronů","Uspořádaný pohyb elektrických nábojů","Zahřívání vodiče","Pohyb jader"],1],
["Jaká je jednotka elektrického proudu?",["Volt","Ohm","Ampér","Watt"],2],
["Který vzorec je Ohmův zákon?",["U = R · I","I = R · U","R = U · I","U = R + I"],0],
["U = 24 V, R = 6 Ω. Kolik je I?",["4 A","18 A","30 A","144 A"],0],
["I = 2 A, R = 5 Ω. Kolik je U?",["2,5 V","7 V","10 V","20 V"],2],
["U = 15 V, I = 3 A. Kolik je R?",["5 Ω","18 Ω","45 Ω","0,2 Ω"],0],
["Atom má 8 protonů a 10 elektronů. Jaký má náboj?",["Kladný","Záporný","Neutrální","Nelze určit"],1],
["Těleso ztratí elektrony. Jaký bude jeho náboj?",["Záporný","Kladný","Neutrální","Žádný"],1],
["Dvě tělesa mají stejný náboj. Co udělají?",["Přitáhnou se","Odpudí se","Nic","Zneutralizují se"],1],
["Atom má 6 protonů a 6 elektronů. Jaký je?",["Kladný iont","Záporný iont","Neutrální","Náboj −2"],2],
["Jaká veličina má jednotku volt (V)?",["Proud","Napětí","Odpor","Náboj"],1]
];
let i=0,score=0,answered=false;
const app=document.getElementById("app"), next=document.getElementById("next"), result=document.getElementById("result");
function render(){
 answered=false; next.style.display="none";
 let q=qs[i];
 app.innerHTML=`<div><b>Otázka ${i+1} z ${qs.length}</b></div><div class="q">${q[0]}</div><div id="opts"></div>`;
 q[1].forEach((x,n)=>{let b=document.createElement("button");b.textContent=(String.fromCharCode(65+n)+") "+x);b.onclick=()=>answer(n);document.getElementById("opts").appendChild(b)});
}
function answer(n){
 if(answered)return; answered=true;
 let q=qs[i],bs=[...document.querySelectorAll("#opts button")];
 bs.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add("correct");if(k===n&&n!==q[2])b.classList.add("wrong")});
 if(n===q[2])score++;
 next.style.display="block";
 next.textContent=i===qs.length-1?"Zobrazit výsledek →":"Další otázka →";
}
next.onclick=()=>{
 if(i<qs.length-1){i++;render()}
 else{app.innerHTML=`<h2>Hotovo! 🎉</h2><p>Výsledek: <b>${score}/${qs.length}</b></p><div class="formula">Tahák: U = R · I &nbsp; | &nbsp; I = U / R &nbsp; | &nbsp; R = U / I</div>`;next.style.display="none";result.textContent=""; }
};
render();
</script>
</body>
</html>
